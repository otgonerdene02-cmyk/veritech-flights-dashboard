name: Check Flight Data Freshness

# fetch-flights.yml өөрөө амжилтгүй болоход issue үүсгэдэг, гэхдээ ТүүНИЙ
# schedule trigger огт ажиллаагүй бол (job эхлээгүй тул) тэр механизм ажиллах
# боломжгүй. Энэ watchdog нь тусдаа cron-оор (өөр цагт) ажиллаж, зөвхөн
# docs/last-sync-status.json-г уншиж хугацаа хэтэрсэн эсэхийг шалгадаг тул
# fetch-flights бүр мөсөн "чимээгүй" зогсоход ч илрүүлдэг.
on:
  schedule:
    - cron: '30 8 * * *'  # 16:30 UB — fetch-flights-ийн 4 cron цагаас өөр
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check staleness and alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const STALE_THRESHOLD_HOURS = 30;

            let status = null;
            try {
              status = JSON.parse(fs.readFileSync('docs/last-sync-status.json', 'utf8'));
            } catch {
              // файл үүсээгүй байна — эхний удаа буюу маш эрт үе
            }

            const lastSuccess = status && status.lastSuccessAt ? new Date(status.lastSuccessAt) : null;
            const hoursSince = lastSuccess ? (Date.now() - lastSuccess.getTime()) / 3600000 : Infinity;

            console.log(`Сүүлийн амжилттай синк: ${status ? status.lastSuccessAt : '(байхгүй)'} (${hoursSince.toFixed(1)} цагийн өмнө)`);

            if (hoursSince <= STALE_THRESHOLD_HOURS) {
              console.log('Дата шинэ байна, alert үүсгэхгүй.');
              return;
            }

            const title = '⚠️ Нислэгийн дата 30+ цагаар шинэчлэгдээгүй байна';
            const body = [
              `Сүүлийн амжилттай синк: ${status && status.lastSuccessAt ? status.lastSuccessAt : 'тодорхойгүй (файл байхгүй)'}`,
              `(${hoursSince === Infinity ? 'хэдэн ч удаа амжилттай ажиллаагүй' : hoursSince.toFixed(1) + ' цагийн өмнө'})`,
              '',
              'Үүнийг шалгах зүйлс:',
              '- "Fetch Veritech Flights" workflow-ийн Actions таб дээрх Run history — schedule эвент огт эхлээгүй vv, эсвэл эхэлсэн ч алдаатай vv?',
              '- Хэрэв огт эхлээгүй бол GitHub-ийн schedule trigger саатсан/алгассан байж болзошгүй — "Run workflow" (workflow_dispatch)-аар гараар ажиллуулж үзнэ vv.',
              '- Хэрэв эхэлсэн ч алдаатай бол sync-failure шошготой issue үүссэн байх ёстой, түүнийг шалгана уу.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'data-freshness',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['data-freshness'],
              });
            }
