name: Fetch Veritech Flights

on:
  schedule:
    # GitHub Actions-ийн "schedule" trigger нь баталгаат биш — ялангуяа нэг
    # л cron-той vед vе vе (заримдаа 24+ цагаар) ажиллагдахгvй алгасагддаг
    # (GitHub-ийн платформын мэдэгдэж буй хязгаарлалт). Vvнээс сэргийлж
    # өдөрт 4 удаа өөр өөр цагт ажиллуулснаар, нэг цаг алгасагдсан ч бусад
    # 3 нь ажиллах магадлалыг нэмэгдvvлнэ. fetchFlights.js нь idempotent
    # (давхар ажиллуулахад аюулгvй, зөвхөн өөрчлөгдсөн мөрийг update хийнэ).
    - cron: '0 22 * * *'  # 06:00 UB
    - cron: '0 4 * * *'   # 12:00 UB
    - cron: '0 10 * * *'  # 18:00 UB
    - cron: '0 16 * * *'  # 00:00 UB
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Бvх түvхэн жилийг дахин бvрэн татах (нэг удаагийн backfill). Хоосон бол зөвхөн одоогийн жилийг татна.'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-flights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch flights from Veritech API
        id: fetch
        continue-on-error: true
        env:
          MRTD_USERNAME: ${{ secrets.MRTD_USERNAME }}
          MRTD_PASSWORD: ${{ secrets.MRTD_PASSWORD }}
          MRTD_INDICATOR_ID: ${{ vars.MRTD_INDICATOR_ID }}
          FETCH_ALL_YEARS: ${{ github.event.inputs.full_backfill == 'true' && '1' || '0' }}
        run: node scripts/fetchFlights.js

      - name: Write sync status
        if: always()
        run: node scripts/writeSyncStatus.js "${{ steps.fetch.outcome }}" "${{ github.run_id }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit and push if changed
        id: commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/flights-*.json docs/last-sync-status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update flights data + sync status [skip ci]"
            git push
          fi

      - name: Open/update issue on failure
        if: steps.fetch.outcome == 'failure' || steps.commit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const step = '${{ steps.fetch.outcome }}' === 'failure' ? 'fetch' : 'commit/push';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🔴 fetch-flights cron амжилтгvй боллоо';
            const body = `\`${step}\` алхам амжилтгvй боллоо.\n\nRun: ${runUrl}\n\nЛогийг шалгаад засаад энэ issue-г хаана уу (дараагийн амжилттай ажиллагаа vvнийг автоматаар хаана).`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'sync-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number,
                body: `Дахин алдаатай ажиллав:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['sync-failure'],
              });
            }

      - name: Close failure issue on success
        if: steps.fetch.outcome == 'success' && steps.commit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'sync-failure',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Дараагийн ажиллагаа амжилттай боллоо: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed',
              });
            }

      - name: Fail job if a step failed
        if: steps.fetch.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: exit 1
