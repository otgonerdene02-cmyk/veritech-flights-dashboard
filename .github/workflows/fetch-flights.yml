name: Fetch Veritech Flights

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = 06:00 Улаанбаатарын цагаар, өдөрт 1 удаа
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Бvх түvхэн жилийг дахин бvрэн татах (нэг удаагийн backfill). Хоосон бол зөвхөн одоогийн жилийг татна.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-flights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch flights from Veritech API
        env:
          MRTD_USERNAME: ${{ secrets.MRTD_USERNAME }}
          MRTD_PASSWORD: ${{ secrets.MRTD_PASSWORD }}
          MRTD_INDICATOR_ID: ${{ vars.MRTD_INDICATOR_ID }}
          FETCH_ALL_YEARS: ${{ github.event.inputs.full_backfill == 'true' && '1' || '0' }}
        run: node scripts/fetchFlights.js

      - name: Commit and push flights.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/flights.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update flights.json [skip ci]"
            git push
          fi
